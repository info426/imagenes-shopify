name: Backup imágenes de marca

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor exacto en Shopify (ej: VIRBAC, CHURU, FARMINA ND)'
        required: true

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Configurar Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Descargar imágenes de Shopify
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          python3 core/process_brand.py \
            --vendor "${{ github.event.inputs.vendor }}" \
            --backup

      - name: Guardar backup con Git LFS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "backup: ${{ github.event.inputs.vendor }}"
          git push
