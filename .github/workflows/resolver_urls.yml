name: Resolver URLs fabricante (web → metacampos)

# Busca la URL oficial de cada producto en la web del fabricante (vía el scraper
# marcas/<slug>.py) y la guarda en el metacampo fuentes.url_fabricante.
# NO procesa imágenes — solo resuelve y escribe la URL.

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor exacto en Shopify (p. ej. Applaws)'
        required: true
      web_url:
        description: 'URL base de la web del fabricante'
        required: false
        default: 'https://applaws.pet/'
      product_ids:
        description: 'Un ID para test, varios separados por coma, vacío = todos'
        required: false
      rebuild_catalog:
        description: 'Forzar re-scraping del catálogo web'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      url_key:
        description: 'Metacampo destino (url_fabricante = campo 1, url_fabricante_2 = campo 2)'
        required: false
        type: choice
        options: ['url_fabricante', 'url_fabricante_2']
        default: 'url_fabricante'
      clear_on_no_match:
        description: 'Borrar el metacampo url_key si no se encuentra URL (limpia errores de run anterior)'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      usar_imagen:
        description: 'Reconocimiento por imagen tipo Google Lens (CLIP). Para CALIBRA usa rebuild_catalog=true la 1ª vez (precomputa huellas)'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      dry_run:
        description: 'Modo prueba: NO escribe en Shopify. Calcula qué pondría y lo compara con el snapshot (precisión sin riesgo)'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'

jobs:
  resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Instalar Playwright
        run: playwright install chromium --with-deps

      - name: Instalar xvfb (navegador headed anti-bot)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Caché de pesos CLIP (evita el rate-limit 429 de HuggingFace)
        if: ${{ github.event.inputs.usar_imagen == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/clip
            ~/.cache/huggingface
          key: clip-vit-b32-openai-v2
          restore-keys: clip-vit-b32-

      - name: Instalar visión CLIP (reconocimiento por imagen)
        if: ${{ github.event.inputs.usar_imagen == 'true' }}
        env:
          # Token HF opcional (secret): autenticado sube el límite y evita el 429.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: |
          # torch/torchvision CPU desde el índice oficial (evita la build CUDA ~2GB)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-vision.txt
          # Pre-descargar los pesos CLIP. 'openai' viene del CDN de OpenAI (Azure),
          # que NO da el 429 de HuggingFace; laion (HF) queda como fallback.
          for i in 1 2 3; do
            python -c "import open_clip; open_clip.create_model_and_transforms('ViT-B-32-quickgelu', pretrained='openai')" && break
            echo "Pre-descarga CLIP 'openai' intento $i falló; reintento en $((i*10))s"; sleep $((i*10))
          done || echo "No se pudieron pre-descargar los pesos CLIP; el run usará hash/texto"

      - name: Resolver URLs y guardar metacampos
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          # Navegador headed (bajo xvfb) para esquivar el filtro anti-bot que
          # bloquea Chromium headless desde las IPs de datacenter de Actions.
          APPLAWS_HEADED: '1'
          # Reconocimiento por imagen (Google Lens-like). 1 = activo (requiere el
          # paso de visión CLIP); 0 = solo texto (con umbral elevado anti-basura).
          IMAGE_MATCH: ${{ github.event.inputs.usar_imagen == 'true' && '1' || '0' }}
          # IDs por env (process_brand los lee y parte por coma con strip) → inmune
          # a que se peguen con espacios tras la coma en el campo de GitHub.
          PRODUCT_IDS: ${{ github.event.inputs.product_ids }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          mkdir -p resultados
          EXTRA=""
          WEB=""
          URLKEY=""
          CLEAR=""
          DRY=""
          [ "${{ github.event.inputs.rebuild_catalog }}" = "true" ]  && EXTRA="--rebuild-catalog"
          [ -n "${{ github.event.inputs.web_url }}" ]                 && WEB="--web-url ${{ github.event.inputs.web_url }}"
          [ -n "${{ github.event.inputs.url_key }}" ]                 && URLKEY="--url-key ${{ github.event.inputs.url_key }}"
          [ "${{ github.event.inputs.clear_on_no_match }}" = "true" ] && CLEAR="--clear-on-no-match"
          [ "${{ github.event.inputs.dry_run }}" = "true" ]           && DRY="--dry-run"
          xvfb-run -a python3 core/process_brand.py \
            --vendor "${{ github.event.inputs.vendor }}" \
            --resolver-urls \
            $WEB $EXTRA $URLKEY $CLEAR $DRY \
            2>&1 | tee resultados/resolver_urls_${{ github.event.inputs.vendor }}.txt

      - name: Guardar log y catálogo
        if: always()
        run: |
          if [ ! -d .git ]; then
            echo "No hay workspace git. Nada que commitear."
            exit 0
          fi
          if [ ! -d resultados ] || [ -z "$(ls -A resultados 2>/dev/null)" ]; then
            echo "resultados/ vacío o ausente. Nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "resolver-urls: ${{ github.event.inputs.vendor }}"
          git pull --rebase && git push
