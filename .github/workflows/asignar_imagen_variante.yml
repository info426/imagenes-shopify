name: Asignar imagen a variante (OCR)

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'ID del producto'
        required: true
      dry_run:
        description: 'Dry-run: solo muestra el matching sin modificar Shopify'
        required: false
        type: choice
        options:
          - 'true'
          - 'false'
        default: 'true'

jobs:
  asignar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Tesseract OCR
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-spa

      - name: Instalar dependencias Python
        run: |
          pip install -r requirements.txt
          pip install pytesseract

      - name: Asignar imágenes a variantes
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          DRY=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          python3 core/assign_variant_images.py \
            --product-id "${{ github.event.inputs.product_id }}" \
            $DRY \
            2>&1 | tee resultados/variant_images_${{ github.event.inputs.product_id }}.txt

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "variant-images: ${{ github.event.inputs.product_id }}"
          git pull --rebase && git push
