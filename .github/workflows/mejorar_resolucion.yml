name: Mejorar resolución con IA (EDSR)

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor exacto en Shopify'
        required: true
      product_ids:
        description: 'IDs de productos separados por coma'
        required: true
      scale:
        description: 'Factor de mejora (2 recomendado, 4 = máxima calidad, más lento)'
        required: false
        type: choice
        options:
          - '2'
          - '4'
        default: '2'

jobs:
  upscale:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Configurar Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install opencv-contrib-python

      - name: Mejorar resolución con EDSR
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          python3 core/upscale.py \
            --vendor "${{ github.event.inputs.vendor }}" \
            --product-ids "${{ github.event.inputs.product_ids }}" \
            --scale "${{ github.event.inputs.scale }}" \
            2>&1 | tee resultados/upscale_${{ github.event.inputs.vendor }}.txt

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "upscale: ${{ github.event.inputs.vendor }}"
          git push
