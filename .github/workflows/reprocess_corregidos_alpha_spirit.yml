name: Re-procesar 9 productos Alpha Spirit corregidos

on:
  workflow_dispatch:

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/alpha-spirit-images-3c4aE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright + Chromium
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Re-procesar 9 snacks con imagen 35gr/50gr corregida
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          PRODUCT_IDS: >-
            15509625274755,15509625405827,15509625635203,15509625700739,
            15509625733507,15509627273603,15509627339139,15509627371907,
            15509627437443
        run: |
          mkdir -p resultados
          python3 process_alpha_spirit.py 2>&1 | tee resultados/reprocess_corregidos_alpha_spirit.txt

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "chore: log re-proceso 9 productos Alpha Spirit corregidos"
          git push
