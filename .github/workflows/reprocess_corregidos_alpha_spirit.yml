name: Re-procesar productos Alpha Spirit corregidos (v3)

on:
  workflow_dispatch:

jobs:
  reprocess:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Playwright + Chromium
        run: |
          pip install -r requirements.txt
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Re-procesar 23 productos con imagen corregida
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          PRODUCT_IDS: >-
            15509627306371,15509627208067,15509627175299,15509627142531,
            15509627109763,15509627076995,15509626945923,15509626814851,
            15509626519939,15509626487171,15509625078147,15509625012611,
            15509624881539,15509624816003,15509624684931,
            15509627634051,15509627404675,15509627044227,15509627011459,
            15509626356099,15509625471363,15509624324483,15509624258947
        run: |
          mkdir -p resultados
          python3 alpha_spirit/process_alpha_spirit.py 2>&1 | tee resultados/reprocess_corregidos_alpha_spirit.txt

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "chore: log re-proceso 23 productos Alpha Spirit corregidos (v3)"
          git push
