name: Unificar productos ARTERO

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simular sin aplicar cambios (true = solo mostrar plan)'
        required: false
        type: choice
        options: ['true', 'false']
        default: 'true'
      group:
        description: 'Grupo concreto (G1, G2, G4, G5, G6, G8) o vacío para todos'
        required: false
        default: ''

jobs:
  unify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests python-dotenv

      - name: Ejecutar unificación
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          ARGS=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && ARGS="--dry-run"
          [ -n "${{ github.event.inputs.group }}" ] && ARGS="$ARGS --group ${{ github.event.inputs.group }}"
          python3 tools/unify_artero.py $ARGS \
            2>&1 | tee resultados/unify_ARTERO.txt

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/unify_ARTERO.txt
          git diff --cached --quiet || git commit -m "unify: ARTERO grupos G1 G2 G4 G5 G6 G8"
          git pull --rebase && git push
