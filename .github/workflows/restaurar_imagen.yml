name: Restaurar calidad de imagen (denoise + IA)

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor exacto en Shopify'
        required: true
      product_ids:
        description: 'IDs de productos separados por coma (restaura todas sus imágenes)'
        required: true
      scale:
        description: 'Factor de super-resolución (2 recomendado, 4 = máxima calidad, más lento)'
        required: false
        type: choice
        options:
          - '2'
          - '4'
        default: '2'
      denoise:
        description: 'Eliminación de ruido / artefactos JPG'
        required: false
        type: choice
        options:
          - 'off'
          - low
          - medium
          - high
        default: medium
      sharpen:
        description: 'Aumento de nitidez (unsharp mask)'
        required: false
        type: choice
        options:
          - 'off'
          - low
          - medium
          - high
        default: medium
      force_padding:
        description: 'Forzar padding (auto=detección automática, true=siempre, false=nunca)'
        required: false
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
        default: auto

jobs:
  restaurar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Configurar Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          pip install opencv-contrib-python

      - name: Restaurar calidad de imágenes
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          python3 core/restore_image.py \
            --vendor "${{ github.event.inputs.vendor }}" \
            --product-ids "${{ github.event.inputs.product_ids }}" \
            --scale "${{ github.event.inputs.scale }}" \
            --denoise "${{ github.event.inputs.denoise }}" \
            --sharpen "${{ github.event.inputs.sharpen }}" \
            --force-padding "${{ github.event.inputs.force_padding || 'auto' }}" \
            2>&1 | tee "resultados/restaurar_$(echo '${{ github.event.inputs.vendor }}' | tr ' /' '__').txt"

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "restaurar: ${{ github.event.inputs.vendor }} ${{ github.event.inputs.product_ids }}"
          git pull --rebase && git push
