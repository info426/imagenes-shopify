name: Test marca (producto de prueba)

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor exacto en Shopify'
        required: true
      fuente:
        description: 'Fuente de imágenes'
        required: true
        type: choice
        options:
          - shopify_backup
          - web_oficial
          - web_y_amazon
        default: shopify_backup
      web_url:
        description: 'URL web fabricante (si fuente != shopify_backup)'
        required: false
      product_id:
        description: 'ID del producto a procesar'
        required: true
      rebuild_catalog:
        description: 'Forzar re-scraping del catálogo web'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Configurar Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Instalar Playwright (solo para fuentes web)
        if: github.event.inputs.fuente != 'shopify_backup'
        run: playwright install chromium --with-deps

      - name: Procesar producto de prueba
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          EXTRA=""
          WEB=""
          [ "${{ github.event.inputs.rebuild_catalog }}" = "true" ] && EXTRA="--rebuild-catalog"
          [ -n "${{ github.event.inputs.web_url }}" ] && WEB="--web-url ${{ github.event.inputs.web_url }}"
          python3 core/process_brand.py \
            --vendor "${{ github.event.inputs.vendor }}" \
            --fuente "${{ github.event.inputs.fuente }}" \
            $WEB \
            --product-id "${{ github.event.inputs.product_id }}" \
            $EXTRA \
            2>&1 | tee resultados/test_${{ github.event.inputs.vendor }}_${{ github.event.inputs.product_id }}.txt

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "test: ${{ github.event.inputs.vendor }} #${{ github.event.inputs.product_id }}"
          git push
