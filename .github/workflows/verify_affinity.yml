name: Verificar unificación AFFINITY

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests python-dotenv

      - name: Verificar unificación
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          python3 scripts/verify_affinity.py 2>&1 | tee resultados/verify_affinity.log
          exit ${PIPESTATUS[0]}

      - name: Subir log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-affinity-log
          path: resultados/verify_affinity.log
          retention-days: 7
