name: Reprocesar imagen individual

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor exacto en Shopify'
        required: true
      product_id:
        description: 'ID del producto. VACÍO = escanear TODA la marca y reprocesar solo las no optimizadas (no WebP / no 2000×2000)'
        required: false
      position:
        description: 'Posición de la imagen (solo modo individual; 1, 2, 3...)'
        required: false
        default: '1'
      pipeline:
        description: 'Pipeline de procesamiento de imagen'
        required: false
        type: choice
        options:
          - standard
          - webp_only
        default: standard
      force_padding:
        description: 'Forzar padding (auto=detección automática, true=siempre, false=nunca)'
        required: false
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
        default: auto

jobs:
  reprocesar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Configurar Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Reprocesar
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          if [ -n "${{ github.event.inputs.product_id }}" ]; then
            TARGET="--product-id ${{ github.event.inputs.product_id }} --position ${{ github.event.inputs.position }}"
            TAG="${{ github.event.inputs.product_id }}_pos${{ github.event.inputs.position }}"
          else
            TARGET=""
            TAG="marca_$(echo '${{ github.event.inputs.vendor }}' | tr ' /' '__')"
          fi
          python3 core/reprocess_image.py \
            --vendor "${{ github.event.inputs.vendor }}" \
            --pipeline "${{ github.event.inputs.pipeline }}" \
            --force-padding "${{ github.event.inputs.force_padding || 'auto' }}" \
            $TARGET \
            2>&1 | tee "resultados/reprocesar_${TAG}.txt"

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "reprocesar: ${{ github.event.inputs.vendor }} ${{ github.event.inputs.product_id }}"
          git pull --rebase && git push
