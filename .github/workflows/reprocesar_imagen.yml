name: Reprocesar imagen individual

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor exacto en Shopify'
        required: true
      product_id:
        description: 'ID del producto'
        required: true
      position:
        description: 'Posición de la imagen (1, 2, 3...)'
        required: true
        default: '1'
      fuente:
        description: 'Fuente de imágenes'
        required: false
        type: choice
        options:
          - shopify_backup
          - web_oficial
          - web_y_amazon
        default: shopify_backup
      web_url:
        description: 'URL web fabricante (si fuente != shopify_backup)'
        required: false
      rebuild_catalog:
        description: 'Forzar re-scraping del catálogo web'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      pipeline:
        description: 'Pipeline de procesamiento de imagen'
        required: false
        type: choice
        options:
          - standard
          - webp_only
        default: standard
      force_padding:
        description: 'Forzar padding (auto=detección automática, true=siempre, false=nunca)'
        required: false
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
        default: auto

jobs:
  reprocesar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: ${{ github.event.inputs.fuente == 'shopify_backup' || github.event.inputs.fuente == '' }}

      - name: Configurar Git LFS
        if: github.event.inputs.fuente == 'shopify_backup' || github.event.inputs.fuente == ''
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Instalar Playwright (solo para fuentes web)
        if: github.event.inputs.fuente != 'shopify_backup' && github.event.inputs.fuente != ''
        run: playwright install chromium --with-deps

      - name: Reprocesar imagen
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          EXTRA=""
          WEB=""
          [ "${{ github.event.inputs.rebuild_catalog }}" = "true" ] && EXTRA="--rebuild-catalog"
          [ -n "${{ github.event.inputs.web_url }}" ] && WEB="--web-url ${{ github.event.inputs.web_url }}"
          PADDING="--force-padding ${{ github.event.inputs.force_padding || 'auto' }}"
          python3 core/reprocess_image.py \
            --vendor "${{ github.event.inputs.vendor }}" \
            --product-id "${{ github.event.inputs.product_id }}" \
            --position "${{ github.event.inputs.position }}" \
            --fuente "${{ github.event.inputs.fuente || 'shopify_backup' }}" \
            --pipeline "${{ github.event.inputs.pipeline }}" \
            $PADDING $WEB $EXTRA \
            2>&1 | tee resultados/reprocesar_${{ github.event.inputs.product_id }}_pos${{ github.event.inputs.position }}.txt

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "reprocesar: ${{ github.event.inputs.vendor }} ${{ github.event.inputs.product_id }} pos${{ github.event.inputs.position }}"
          git pull --rebase && git push
