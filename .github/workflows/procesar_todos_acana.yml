name: Procesar todos Acana

on:
  workflow_dispatch:
    inputs:
      rebuild_catalog:
        description: 'Forzar re-scraping del catálogo web'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Instalar Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Procesar todos los productos Acana
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          EXTRA=""
          [ "${{ github.event.inputs.rebuild_catalog }}" = "true" ] && EXTRA="--rebuild-catalog"
          python3 acana/process_acana.py $EXTRA \
            2>&1 | tee resultados/proceso_completo_acana.txt

      - name: Guardar resultados
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "chore: proceso completo Acana"
          git push
