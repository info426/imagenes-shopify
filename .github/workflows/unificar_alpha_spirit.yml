name: Unificar productos Alpha Spirit

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (true = solo mostrar cambios, sin modificar Shopify)'
        required: false
        default: 'false'

jobs:
  unificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/alpha-spirit-images-3c4aE

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Ejecutar unificación
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python3 unificar_alpha_spirit.py --dry-run 2>&1 | tee resultados/unificacion_alpha_spirit.txt
          else
            python3 unificar_alpha_spirit.py 2>&1 | tee resultados/unificacion_alpha_spirit.txt
          fi

      - name: Guardar log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "chore: log unificación Alpha Spirit"
          git push
