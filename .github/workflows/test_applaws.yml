name: Test Applaws (producto de prueba)

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'ID numérico del producto Applaws a procesar'
        required: true
      from_originals:
        description: 'Usar imágenes guardadas en backup (true/false)'
        required: false
        default: 'false'

jobs:
  procesar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Procesar producto de prueba
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          EXTRA=""
          if [ "${{ github.event.inputs.from_originals }}" = "true" ]; then
            EXTRA="--from-originals"
          fi
          python3 applaws/process_applaws.py \
            --product-id "${{ github.event.inputs.product_id }}" \
            $EXTRA \
            2>&1 | tee resultados/prueba_applaws_${{ github.event.inputs.product_id }}.txt

      - name: Guardar log y originales
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "chore: log prueba Applaws ${{ github.event.inputs.product_id }}"
          git push
