name: Procesar imágenes de marca

on:
  workflow_dispatch:
    inputs:
      vendor:
        description: 'Vendor exacto en Shopify'
        required: true
      fuente:
        description: 'Fuente de imágenes'
        required: true
        type: choice
        options:
          - shopify_backup
          - web_oficial
          - web_y_amazon
        default: shopify_backup
      web_url:
        description: 'URL web fabricante (si fuente != shopify_backup)'
        required: false
      product_ids:
        description: 'Un ID para test, varios separados por coma para batch, vacío = todos'
        required: false
      rebuild_catalog:
        description: 'Forzar re-scraping del catálogo web'
        required: false
        type: choice
        options: ['false', 'true']
        default: 'false'
      pipeline:
        description: 'Pipeline de procesamiento de imagen'
        required: false
        type: choice
        options:
          - standard
          - webp_only
        default: standard
      force_padding:
        description: 'Forzar padding (auto=detección automática, true=siempre, false=nunca)'
        required: false
        type: choice
        options:
          - auto
          - 'true'
          - 'false'
        default: auto

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true

      - name: Configurar Git LFS
        run: git lfs install

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Instalar Playwright (solo para fuentes web)
        if: github.event.inputs.fuente != 'shopify_backup'
        run: playwright install chromium --with-deps

      - name: Procesar imágenes
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        run: |
          mkdir -p resultados
          EXTRA=""
          WEB=""
          IDS=""
          [ "${{ github.event.inputs.rebuild_catalog }}" = "true" ] && EXTRA="--rebuild-catalog"
          [ -n "${{ github.event.inputs.web_url }}" ]     && WEB="--web-url ${{ github.event.inputs.web_url }}"
          [ -n "${{ github.event.inputs.product_ids }}" ] && IDS="--only-ids ${{ github.event.inputs.product_ids }}"
          PADDING="--force-padding ${{ github.event.inputs.force_padding || 'auto' }}"
          python3 core/process_brand.py \
            --vendor "${{ github.event.inputs.vendor }}" \
            --fuente "${{ github.event.inputs.fuente }}" \
            --pipeline "${{ github.event.inputs.pipeline }}" \
            $PADDING $WEB $IDS $EXTRA \
            2>&1 | tee resultados/proceso_${{ github.event.inputs.vendor }}.txt

      - name: Guardar log y catálogos
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "proceso: ${{ github.event.inputs.vendor }}"
          git pull --rebase && git push
