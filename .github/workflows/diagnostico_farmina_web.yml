name: Diagnóstico web farmina.com

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install chromium
          python -m playwright install-deps chromium

      - name: Ejecutar diagnóstico
        run: |
          mkdir -p resultados
          python3 farmina_nd/diagnostico_farmina_web.py | tee resultados/diagnostico_farmina_web.txt

      - name: Guardar resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          git diff --cached --quiet || git commit -m "chore: diagnóstico web farmina.com"
          git push
