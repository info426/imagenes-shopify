name: Actualizar EAN CALIBRA

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no escribe en Shopify, solo muestra qué cambiaría)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

jobs:
  actualizar-ean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Actualizar EANs CALIBRA Joy Classic en Shopify
        env:
          SHOP_DOMAIN: ${{ secrets.SHOP_DOMAIN }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python3 - << 'PYEOF'
          import os, sys, time, requests as _req
          sys.path.insert(0, ".")
          from core.shopify_api import SHOP_DOMAIN, CLIENT_ID, CLIENT_SECRET, API_VERSION

          DRY_RUN = os.getenv("DRY_RUN", "false").lower() == "true"
          if DRY_RUN:
              print("=== DRY RUN — no se escribirá nada en Shopify ===\n")

          # Los 9 cambios confirmados (EAN viejo → EAN nuevo)
          # Fuente: resultados/CALIBRA_ean_discrepancias.md
          CAMBIOS = [
              # variant_id, ean_viejo, ean_nuevo, descripcion
              (56974022541699, "8595706703536", "8595706703581", "DOG LIFE POUCH PUPPY&JUNIOR CHICKEN→POLLO 10X150G"),
              (56974025687427, "8594062088493", "8595706703949", "JOY DOG CLASSIC CORDERO STRIPS 250GR"),
              (56974025851267, "8594062088479", "8595706703895", "JOY DOG CLASSIC PATO STRIPS 250GR"),
              (56974026047875, "8594062088486", "8595706703918", "JOY DOG CLASSIC PESCADO POLLO SANDWICH 250GR"),
              (56974026113411, "8594062088509", "8595706703970", "JOY DOG CLASSIC SALMON STICKS 250GR"),
              (56974026408323, "8594062084983", "8595706703963", "JOY DOG CLASSIC STICKS SALMON 80GR"),
              (56974026506627, "8594062087687", "8595706703857", "JOY DOG CLASSIC STICKS TERNERA 80GR"),
              (56974026604931, "8594062084952", "8595706703932", "JOY DOG CLASSIC STRIPS CORDERO 80GR"),
              (56974026703235, "8594062088455", "8595706703864", "JOY DOG CLASSIC TERNERA STICKS 250GR"),
          ]

          # Obtener token — diagnóstico explícito si falla
          print(f"Autenticando contra {SHOP_DOMAIN} ...")
          if not CLIENT_ID or not CLIENT_SECRET:
              print("ERROR: CLIENT_ID o CLIENT_SECRET vacíos.")
              sys.exit(1)
          resp = _req.post(
              f"https://{SHOP_DOMAIN}/admin/oauth/access_token",
              data={"grant_type": "client_credentials",
                    "client_id": CLIENT_ID, "client_secret": CLIENT_SECRET},
              timeout=15,
          )
          if not resp.ok:
              print(f"ERROR al obtener token: HTTP {resp.status_code}\n{resp.text[:500]}")
              sys.exit(1)
          token = resp.json().get("access_token")
          if not token:
              print(f"ERROR: respuesta sin access_token: {resp.text[:300]}")
              sys.exit(1)
          print("Token obtenido.\n")

          headers = {"X-Shopify-Access-Token": token, "Content-Type": "application/json"}
          base = f"https://{SHOP_DOMAIN}/admin/api/{API_VERSION}"

          def find_variant_by_sku(sku):
              """Busca el variant_id actual en Shopify por SKU/barcode."""
              r = _req.get(f"{base}/variants.json",
                           headers=headers, params={"limit": 1}, timeout=15)
              # Shopify no permite buscar variante por SKU directamente en REST;
              # usamos la búsqueda de producto por SKU
              r = _req.get(f"{base}/products.json",
                           headers=headers,
                           params={"limit": 250, "vendor": "CALIBRA"},
                           timeout=30)
              products = r.json().get("products", [])
              link = r.headers.get("Link", "")
              while 'rel="next"' in link:
                  next_url = [p.strip().strip("<>") for p in link.split(",")
                              if 'rel="next"' in p][0].split(";")[0].strip()
                  r = _req.get(next_url, headers=headers, timeout=30)
                  products.extend(r.json().get("products", []))
                  link = r.headers.get("Link", "")
              for p in products:
                  for v in p.get("variants", []):
                      if v.get("sku") == sku or v.get("barcode") == sku:
                          return v["id"], p["title"]
              return None, None

          ok, fail = 0, 0
          for vid, ean_viejo, ean_nuevo, desc in CAMBIOS:
              if DRY_RUN:
                  print(f"  [DRY] {ean_viejo} → {ean_nuevo}  ({desc})")
                  ok += 1
                  continue

              # Intentar con el variant_id conocido; si 404, buscar por SKU
              url = f"{base}/variants/{vid}.json"
              probe = _req.get(url, headers=headers, timeout=15)
              if probe.status_code == 404:
                  print(f"  ⚠ variant {vid} no encontrado (posible reID tras unificación) — buscando por SKU {ean_viejo}...")
                  vid_actual, titulo = find_variant_by_sku(ean_viejo)
                  if vid_actual is None:
                      print(f"  ✗ EAN {ean_viejo} no encontrado en ninguna variante CALIBRA — saltando")
                      fail += 1
                      continue
                  print(f"    → Encontrado: variant {vid_actual} en «{titulo}»")
                  vid = vid_actual

              try:
                  payload = {"variant": {"id": vid, "barcode": ean_nuevo, "sku": ean_nuevo}}
                  r = _req.put(f"{base}/variants/{vid}.json",
                               headers=headers, json=payload, timeout=15)
                  if not r.ok:
                      print(f"  ✗ variant {vid} HTTP {r.status_code}: {r.text[:300]}")
                      fail += 1
                      time.sleep(0.5)
                      continue
                  v = r.json()["variant"]
                  if v["barcode"] == ean_nuevo:
                      print(f"  ✓ variant {vid}: {ean_viejo} → {ean_nuevo}  ({desc})")
                      ok += 1
                  else:
                      print(f"  ✗ variant {vid}: barcode={v['barcode']} (esperado {ean_nuevo})")
                      fail += 1
              except Exception as e:
                  print(f"  ✗ variant {vid} EXCEPCIÓN: {e}")
                  fail += 1
              time.sleep(0.4)

          print(f"\nResultado: {ok} OK  |  {fail} errores")
          if fail:
              sys.exit(1)
          PYEOF
